# docker-compose.yml — Prometheus + Grafana for the orca-blackbox host lane.
#   docker compose -f deploy/monitoring/docker-compose.yml up -d
# Grafana: http://localhost:3000 (admin/admin, change it) → import community
# dashboard ID 12949 (Windows) and point it at the prometheus datasource
# provisioned below.
services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  prom-data:
  grafana-data:
