[pytest]
# no:cacheprovider — the .pytest_cache dir is repo noise on a shared rig and
# the last-failed cache is meaningless for subprocess-shell cases
addopts = -p no:cacheprovider
testpaths = tests
markers =
    tier_a: coverage tier A (strong)
    tier_b: coverage tier B (weak/partial)
    tier_tbd: tier not yet registered in BLACKBOX_CASES.md
